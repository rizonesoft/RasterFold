# Reviewer pin for independent-review (scripts/review-dispatch.py).
#
# Antigravity CLI (writer `agy`, serving Claude or Gemini models) is the only writer in this repository and GPT-6 Astra through the Codex CLI is the only reviewer: one route, no fallback. When Astra returns no review, nothing else runs and the round is not an approval.
#
# Every pass's effort and lenses come from [schedule] below, enforced by scripts/review-dispatch.py from the findings file passed to --record:
#   - before the build, one pass of --kind plan at medium effort (adversarial, completeness, consistency, integration, and record on the section's plan);
#   - after the build, one pass of --kind completion at medium effort (completeness and excellence against the domain and reference codecs);
#   - then the review rounds: round 1 at high effort (adversarial + integration), round 2 at medium (adversarial), round 3 at low (adversarial), and from round 4 on one lens per round at low effort, rotating consistency, design (only when --surface is passed), and record. If a low-effort round reports HIGHEST: P1, the next round escalates once to medium adversarial. Any round with no Critical (P1) or Important (P2) finding (HIGHEST: none or HIGHEST: P3) may stop the loop on the first such round (`severity_stop_after = 0`).

schema_version = 1

[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "medium"

[routes]
agy = ["astra"]

[schedule]
severity_stop_after = 0

[schedule.plan]
effort = "medium"
lenses = ["plan"]

[schedule.completion]
effort = "medium"

[[schedule.rounds]]
effort = "high"
lenses = ["adversarial", "integration"]

[[schedule.rounds]]
effort = "medium"
lenses = ["adversarial"]

[[schedule.rounds]]
effort = "low"
lenses = ["adversarial"]

[schedule.rotation]
effort = "low"
lenses = ["consistency", "design", "record"]

[schedule.escalation]
effort = "medium"
lenses = ["adversarial"]
