# Reviewer pin for independent-review (scripts/review-dispatch.py).
#
# Owner decision 2026-10-27: Claude Code, Muse Code, Antigravity and Codex can write. Codex's independent reviewer
# is Muse Spark 1.3; the other writers use GPT-6 Astra. Each route has one reviewer and no fallback. An outage is
# never an approval. Both reviewers use the same schedule.
# Owner decision 2026-10-29: OpenCode (`opencode`, running an Anthropic model) can also write, reviewed by GPT-6
# Astra.
# Owner decision 2026-10-30: GitHub Copilot CLI (`copilot`, pinned to an Anthropic model, never Auto) can also
# write, reviewed by GPT-6 Astra.
#
# Owner decision 2026-11-06: the writers are Claude Code, Codex, Gemini (through Antigravity), Muse Code and OpenCode.
# The only reviewers are GPT-6 Astra through the Codex CLI and Gemini 4 Argon through the Antigravity CLI: Codex work goes
# to Argon so no writer reviews itself, and every other writer's work goes to Astra. Antigravity carries the effort in
# the model name, which the pin's loader holds to the schedule. The review shape
# is three passes at medium effort, from Is It Legit's three-pass chain:
#   - before the build, one plan review (--kind plan);
#   - after the build and its gates, one combined adversarial round (--kind round); its findings are fixed and the gates rerun;
#   - on that final candidate, one completion review (--kind completion).
# A completion that returns gaps blocks the stamp until the one reconciliation pass (--kind reconciliation) passes on
# the repaired candidate. A second reconciliation is refused.
# A section keeps the pin at its plan review's candidate, so sections already under review finish on their own rules.

schema_version = 1

[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "medium"

[reviewers.argon]
cli = "agy"
model = "gemini-4-argon-medium"

[routes]
claude = ["astra"]
codex = ["argon"]
gemini = ["astra"]
muse = ["astra"]
opencode = ["astra"]

[schedule]
policy = "three-pass"

[schedule.plan]
effort = "medium"
lenses = ["plan"]

[[schedule.rounds]]
effort = "medium"
lenses = ["adversarial", "integration", "source-defect", "plan-delivery", "consistency", "record", "quality", "optimization", "design"]

[schedule.completion]
effort = "medium"

[schedule.reconciliation]
effort = "medium"
lenses = ["adversarial", "integration", "plan-delivery", "record"]
