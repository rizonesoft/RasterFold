name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs these same jobs on the commit it is about to publish.
  workflow_call:
    inputs:
      ref:
        description: "Commit to build and test (default: the triggering commit)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# A push or pull request run cancels an older run of the same ref. A run called by another workflow (the release,
# which passes `ref`) gets a group of its own run: a rehearsal and a tagged release of one commit never cancel each
# other's gates, and the `gates-` prefix keeps the group apart from the calling workflow's own group.
concurrency:
  group: gates-${{ github.workflow }}-${{ inputs.ref && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Cache checked compiler archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/downloads
          key: linux-toolchain-${{ hashFiles('toolchain.json') }}
      - name: Install local toolchains and test environment
        run: |
          python3 tools/bootstrap.py
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Build all target artifacts
        run: python3 scripts/build.py --target all
      - name: Linux runtime, ABI and file-safety tests
        run: |
          .venv/bin/python tests/test_correctness.py
          .venv/bin/python tests/test_api.py
          .venv/bin/python tests/test_artifacts.py
          .venv/bin/python tests/fuzz_decode.py 300 1
      - name: Package, release verifier and version tests
        run: |
          python3 -m unittest discover -s tests -p test_package.py -v
          python3 -m unittest discover -s tests -p test_version.py -v
      - name: Portable arithmetic fidelity
        run: |
          python3 scripts/build.py --portable
          RF_TEST_EXE="$PWD/bin/linux-x64-portable/bin/rasterfold" .venv/bin/python tests/test_correctness.py
      - name: Verify local toolchain and package development artifacts
        run: |
          python3 tools/bootstrap.py --verify
          python3 scripts/package.py --target all
      - name: Upload binaries and libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-platform-development-packages
          path: build/packages/*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Cache checked compiler archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/downloads
          key: windows-toolchain-${{ hashFiles('toolchain.json') }}
      - name: Install compiler and test dependency
        shell: pwsh
        run: |
          ./tools/bootstrap.ps1
          python -m pip install -r requirements-dev.txt
      - name: Build native Windows executable and libraries
        shell: pwsh
        run: ./build.ps1
      - name: Windows runtime and library consumers
        run: |
          python tests/test_correctness.py
          python tests/test_api.py
          python tests/test_artifacts.py
          python tests/fuzz_decode.py 300 1
      - name: Package and release verifier tests
        run: python -m unittest discover -s tests -p test_package.py -v
      - name: Package Windows artifacts
        run: python scripts/package.py --target windows-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-development-package
          path: build/packages/*
          if-no-files-found: error
