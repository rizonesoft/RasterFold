name: release

# A pushed tag rasterfold-v<VERSION> is a release: every gate that runs on a push runs on the tagged commit, the
# packages are built once, run on Linux and on Windows, and only then published with their checksums and the
# changelog's notes. A manual run (workflow_dispatch) is a dry run of everything except publication: it never
# creates a release or a tag. docs/building.md describes the procedure.

on:
  push:
    tags:
      - "rasterfold-v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Dry run: 40-character commit SHA on main to gate, package and verify (nothing is published)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || inputs.source_ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the commit, the version and whether this run publishes
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF_TYPE" != "tag" ]; then
              echo "error: a release run starts from a tag, not from $REF_TYPE $REF_NAME" >&2
              exit 1
            fi
            TAG="$REF_NAME"
            TARGET_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
            PUBLISH=true
          else
            if ! printf '%s\n' "$INPUT_SOURCE_REF" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "error: source_ref must be a 40-character lowercase hex commit SHA (got: $INPUT_SOURCE_REF)" >&2
              exit 1
            fi
            if ! git cat-file -e "${INPUT_SOURCE_REF}^{commit}" 2>/dev/null; then
              echo "error: commit $INPUT_SOURCE_REF does not exist in the repository" >&2
              exit 1
            fi
            TAG=""
            TARGET_SHA="$INPUT_SOURCE_REF"
            PUBLISH=false
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "error: commit $TARGET_SHA is not on main; a release is cut from main" >&2
            exit 1
          fi
          git checkout --detach "$TARGET_SHA"
          VERSION="$(python3 scripts/version.py)"
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          if [ "$PUBLISH" = "true" ]; then
            # The tag is the version, and the changelog has that version's notes, before anything is built.
            python3 scripts/version.py --tag "$TAG"
            python3 scripts/version.py --release-notes > /dev/null
          fi
          {
            echo "sha=$TARGET_SHA"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "publish=$PUBLISH"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "release: commit $TARGET_SHA, version $VERSION, tag '${TAG:-none (dry run)}', publish=$PUBLISH, prerelease=$PRERELEASE"

  # Every gate a push runs, on the release commit: the same workflows, called, never a second copy of their steps.
  build-gates:
    needs: resolve
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  plan-gates:
    needs: resolve
    uses: ./.github/workflows/plan.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  package:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Cache checked compiler archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/downloads
          key: linux-toolchain-${{ hashFiles('toolchain.json') }}
      - name: Install the pinned toolchains
        run: python3 tools/bootstrap.py
      - name: Build both targets from the release commit
        run: python3 scripts/build.py --target all
      - name: Write the release packages and their checksums
        run: |
          set -euo pipefail
          python3 scripts/package.py --release --target all
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Export the release notes from CHANGELOG.md
        env:
          PUBLISH: ${{ needs.resolve.outputs.publish }}
        run: |
          set -euo pipefail
          mkdir -p build/release-notes
          if [ "$PUBLISH" = "true" ]; then
            python3 scripts/version.py --release-notes > build/release-notes/RELEASE_NOTES.md
          elif ! python3 scripts/version.py --release-notes > build/release-notes/RELEASE_NOTES.md; then
            # A dry run before the release moved the Unreleased section under its version.
            python3 scripts/version.py --release-notes --unreleased > build/release-notes/RELEASE_NOTES.md
          fi
          test -s build/release-notes/RELEASE_NOTES.md
      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            dist/rasterfold-${{ needs.resolve.outputs.version }}-linux-x64.zip
            dist/rasterfold-${{ needs.resolve.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: build/release-notes/RELEASE_NOTES.md
          if-no-files-found: error

  # The packages are run before they are published: checksums, the reported version and a lossless round trip,
  # with the packaged executable, on each platform a package is for.
  verify:
    needs: [resolve, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            python: python3
          - os: windows-2025
            target: windows-x64
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release-packages
      - name: Run the package
        run: ${{ matrix.python }} scripts/verify_release.py --dist release-packages --target ${{ matrix.target }} --version ${{ needs.resolve.outputs.version }}

  publish:
    needs: [resolve, build-gates, plan-gates, package, verify]
    if: github.event_name == 'push' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release-packages
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          (cd release-packages && sha256sum -c SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "error: a release for $TAG already exists; a published release is never replaced" >&2
            exit 1
          fi
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "RasterFold $VERSION" \
            --notes-file release-notes/RELEASE_NOTES.md "${FLAGS[@]}" \
            "release-packages/rasterfold-$VERSION-linux-x64.zip" \
            "release-packages/rasterfold-$VERSION-windows-x64.zip" \
            release-packages/SHA256SUMS
      - name: Read the published assets back
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > published.txt
          printf '%s\n' SHA256SUMS "rasterfold-$VERSION-linux-x64.zip" "rasterfold-$VERSION-windows-x64.zip" | sort > expected.txt
          diff expected.txt published.txt
          cat published.txt
