name: plan-gates

# Plan tooling gates (ported from Isotone's plan.yml): the TODO graph tool
# self-tests, the TODO tree validates, the plan projection is current, the
# measured claims hold, the review records agree, and the commit hooks are
# intact (mode 100755, LF). The campaign guard self-test drives the real Stop
# hook on both Linux and Windows; Codex uses fixture-only native event tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history: the validator's git legs (provenance candidates,
          # fix-commit proofs, ancestry) cannot resolve on a shallow checkout.
          fetch-depth: 0
      - name: Verify checked-out candidate commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$HEAD_SHA" || { echo "checkout mismatch: HEAD=$ACTUAL_SHA expected=$HEAD_SHA" >&2; exit 1; }
      - name: Self-test the TODO graph tool
        run: python3 scripts/todo-graph.py self-test
      - name: Validate the TODO tree
        run: python3 scripts/todo-graph.py validate
      - name: Check plan projection is current
        run: |
          python3 scripts/todo-graph.py plan --check
          python3 scripts/plan-audit.py
      - name: Check the generated milestone files
        run: python3 research/milestones.py --check
      - name: Re-measure the TODOs' claims
        run: python3 scripts/todo-claims.py
      - name: Check documents and repair boundaries
        run: |
          python3 scripts/drift-check.py
          python3 -m unittest discover -s tests -p test_drift.py -v
          python3 -m unittest discover -s tests -p test_plan_audit.py -v
      - name: Stage allowlisted Jekyll site source
        run: |
          python3 scripts/build-docs.py --self-test
          python3 scripts/build-docs.py --check
          python3 scripts/build-docs.py --stage build/site-source
      - name: Build Jekyll documentation site from allowlisted source
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: build/site-source
          destination: build/site-raw
      - name: Verify built Jekyll site navigation and boundaries
        run: |
          rm -rf build/site-artifact
          cp -R build/site-raw build/site-artifact
          python3 -c '
          from html.parser import HTMLParser
          import pathlib

          class NavParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.nav_depth = 0
                  self.cur_href = None
                  self.cur_text = []
                  self.nav_links = {}

              def handle_starttag(self, tag, attrs):
                  ad = dict(attrs)
                  if tag == "nav" and (ad.get("id") == "site-nav" or ad.get("aria-label") == "Main"):
                      self.nav_depth = 1
                  elif self.nav_depth > 0:
                      if tag == "nav":
                          self.nav_depth += 1
                      elif tag == "a" and ad.get("href"):
                          self.cur_href = ad["href"]
                          self.cur_text = []

              def handle_data(self, data):
                  if self.nav_depth > 0 and self.cur_href is not None:
                      self.cur_text.append(data)

              def handle_endtag(self, tag):
                  if self.nav_depth > 0:
                      if tag == "a" and self.cur_href is not None:
                          self.nav_links[self.cur_href] = "".join(self.cur_text).strip()
                          self.cur_href = None
                          self.cur_text = []
                      elif tag == "nav":
                          self.nav_depth -= 1

          site = pathlib.Path("build/site-artifact")
          parser = NavParser()
          parser.feed((site / "index.html").read_text(encoding="utf-8"))
          assert parser.nav_links, "no links found inside site-nav"
          for slug, nav_hrefs, title, src_rel in [
              ("index.html", ("/RasterFold/", "/RasterFold/index.html"), "Overview", "docs/index.md"),
              ("getting-started.html", ("/RasterFold/getting-started.html",), "Getting Started", "docs/getting-started.md"),
              ("usage.html", ("/RasterFold/usage.html",), "CLI and Library Usage", "README.md"),
              ("format.html", ("/RasterFold/format.html",), "Format Specification", "spec/FOLD.md"),
              ("benchmarks.html", ("/RasterFold/benchmarks.html",), "Benchmarks", "docs/benchmarks.md"),
              ("research-summary.html", ("/RasterFold/research-summary.html",), "Research Summary", "docs/research.md"),
          ]:
              page_path = site / slug
              assert page_path.is_file(), f"missing built page: {slug}"
              matched_href = next((h for h in nav_hrefs if parser.nav_links.get(h) == title), None)
              assert matched_href is not None, f"missing nav link {nav_hrefs} -> {title!r} in {parser.nav_links}"
              rel_target = matched_href[len("/RasterFold/"):] or "index.html"
              assert (site / rel_target).is_file(), f"nav link destination missing: {rel_target}"
              assert pathlib.Path(src_rel).is_file(), f"missing repository source file: {src_rel}"
              page_html = page_path.read_text(encoding="utf-8")
              expected_edit = f"href=\"https://github.com/rizonesoft/RasterFold/tree/main/{src_rel}\" id=\"edit-this-page\""
              assert expected_edit in page_html, f"{slug}: missing expected edit link {expected_edit}"
          bench_html = (site / "benchmarks.html").read_text(encoding="utf-8")
          for chart_name in ("corpus-size-ratio", "benchmark-size-ratio", "encode-time", "decode-time", "peak-memory", "scatter-e9", "size-vs-decode"):
              assert f"data-chart=\"{chart_name}\"" in bench_html, f"benchmarks.html: missing rendered SVG chart {chart_name}"
          assert bench_html.count("<table") >= 7, f"benchmarks.html: expected at least 7 rendered tables, got {bench_html.count(\"<table\")}"
          print("jekyll navigation, source links, and 7 benchmark charts/tables verified: 6 pages")
          '
          python3 scripts/drift-check.py --site-dir build/site-artifact --write-site-receipt
          python3 scripts/drift-check.py --site-dir build/site-artifact
          sudo rm -rf build/site-source build/site-raw build/site-artifact
      - name: Check commit fact declarations against each commit's own source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            python3 scripts/drift-check.py --commit-range "$BASE_SHA..$HEAD_SHA"
          elif git rev-parse --verify -q "$HEAD_SHA^^{commit}" >/dev/null 2>&1; then
            python3 scripts/drift-check.py --commit-range "$(git rev-parse "$HEAD_SHA^")..$HEAD_SHA"
          else
            python3 scripts/drift-check.py --commit-range "$HEAD_SHA"
          fi
      - name: Check the findings ledger and run records
        run: |
          python3 scripts/todo-findings.py --check
          python3 scripts/todo-runs.py --check
      - name: Self-test the review tooling and automations
        run: |
          python3 scripts/todo-claims.py --self-test
          python3 scripts/todo-findings.py --self-test
          python3 scripts/todo-runs.py --self-test
          python3 scripts/review-dispatch.py --check-pin
          python3 scripts/review-dispatch.py --list-rounds
          python3 -m unittest discover -s scripts/tests -v
      - name: Check toolchain installer and intelligence
        run: |
          python3 -m unittest discover -s tests -p test_toolchain.py -v
          python3 scripts/intelligence.py validate
      - name: Assert commit hooks are intact
        run: |
          for hook in pre-commit commit-msg; do
            test "$(git ls-files -s tools/githooks/$hook | cut -d' ' -f1)" = "100755" || { echo "$hook index mode is not 100755"; exit 1; }
            git show HEAD:tools/githooks/$hook > /tmp/hook-blob || exit 1
            if grep -q $'\r' /tmp/hook-blob; then echo "$hook blob carries CR"; exit 1; fi
            git check-attr eol -- tools/githooks/$hook | grep -q ': eol: lf$' || { echo "$hook eol pin missing"; exit 1; }
          done

  campaign-guard:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Self-test the campaign guard
        shell: pwsh
        run: python3 scripts/campaign_guard.py --self-test
      - name: Test document and plan gates on the host
        shell: pwsh
        run: |
          python3 -m unittest discover -s tests -p test_drift.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 -m unittest discover -s tests -p test_plan_audit.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 scripts/drift-check.py
          exit $LASTEXITCODE
