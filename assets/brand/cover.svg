<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">RasterFold. Every pixel, preserved.</title>
<desc id="desc">A folded cyan and lime pixel mark on a dark grid. Lossless RGB image compression, version 2 format, command line and C library.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b32"/><stop offset="1" stop-color="#060c19"/></linearGradient>
  <linearGradient id="fold" x2="1" y2="1"><stop stop-color="#b5f46b"/><stop offset="1" stop-color="#36d7d1"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d1e6ff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1280" height="560" rx="24" fill="url(#bg)"/>
<rect width="1280" height="560" rx="24" fill="url(#grid)"/>
<path d="M0 465H1280" stroke="#294057" stroke-width="1"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
 <text x="76" y="86" fill="#78dedd" font-size="15" letter-spacing="5">RIZONESOFT / IMAGE CODECS</text>
 <text x="70" y="218" fill="#f3f8ff" font-size="96" font-weight="700" letter-spacing="-5">RasterFold</text>
 <text x="76" y="281" fill="#c4d1e6" font-size="31" font-weight="400">Every pixel, preserved.</text>
 <text x="76" y="352" fill="#8397b3" font-size="20">Lossless RGB. A small C core. An open format.</text>
 <text x="76" y="515" fill="#d5e2f6" font-size="15" letter-spacing="2">WINDOWS / LINUX / ANDROID</text>
 <text x="751" y="515" fill="#8397b3" font-size="14" letter-spacing="2">RGB8</text>
 <text x="886" y="515" fill="#8397b3" font-size="14" letter-spacing="2">FORMAT 02</text>
 <text x="1060" y="515" fill="#8397b3" font-size="14" letter-spacing="2">CLI + C API</text>
</g>
<g transform="translate(905 131)">
 <rect x="-20" y="-20" width="260" height="260" rx="28" fill="#14283b" stroke="#263e50"/>
 <path d="M16 16H204V78H78V204H16Z" fill="url(#fold)"/>
 <path d="M78 78H204L78 204Z" fill="#20a9b1"/>
 <path d="M78 78H142L78 142Z" fill="#e9ffbe"/>
 <rect x="148" y="148" width="56" height="56" rx="5" fill="#ff936c"/>
 <path d="M78 78L204 78M78 78V204" fill="none" stroke="#061c27" stroke-opacity=".22"/>
</g>
</svg>
