<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RasterFold Converter Reference</title>
<!--
  Visual reference for docs/design/converter.md. That file is the contract and
  wins where this drawing disagrees. Every window is drawn at the default client
  size (1280 x 800 DIP at 100%) with the Geometry table's values; colours are the
  Resolute-SDK DESIGN.md palette at bddf5860, and tokens that table leaves out
  (surfaceHover, surfaceActive, semantic, surfaceBase) are stand-ins until the
  pinned theme.cpp supplies them. Figures are placeholders, not measurements.
-->
<style>
:root{
  --background:#F6F5F2; --surface:#ECEAE5; --surfaceHover:#E2DFD8; --surfaceActive:#D9D5CD; --toolbar:#FCFBF9;
  --border:#827E76; --hair:#D6D3CC; --text:#17191E; --textSecondary:#56524A; --statusBar:#E8E6E0;
  --accent:#8A5A00; --accentSubtle:#F6E7C6; --success:#1F7A3F; --warning:#9A5B00; --error:#B42318; --info:#2459A8;
  --surfaceBase:#8E8C86; --scrim:rgb(0 0 0 / .55);
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; --mono:"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --background:#17191E; --surface:#1F2228; --surfaceHover:#2A2E36; --surfaceActive:#33373F; --toolbar:#23262D;
  --border:#80858F; --hair:#33373F; --text:#ECEAE5; --textSecondary:#B0B3BA; --statusBar:#1B1D22;
  --accent:#FFB020; --accentSubtle:#3A3018; --success:#5FD08A; --warning:#FFB020; --error:#FF8A7A; --info:#7EB6FF;
  --surfaceBase:#4A4D54; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--text);font:13px/1.4 var(--ui);padding:24px 16px 48px}
.top{max-width:1280px;margin:0 auto 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.top h1{font-size:20px;font-weight:600;margin:0 auto 0 0}
.top p{flex-basis:100%;margin:0;color:var(--textSecondary);max-width:80ch}
.toggle{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.toggle button{font:inherit;color:var(--text);background:var(--toolbar);border:0;padding:6px 12px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--accentSubtle);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
figure{margin:0 auto 40px;max-width:1282px}
figcaption{font-weight:600;margin-bottom:8px}
figcaption span{font-weight:400;color:var(--textSecondary)}
.scroll{overflow-x:auto}
/* window: 1280 x (32 caption + 800 client) */
.win{width:1282px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--background);box-shadow:0 8px 24px rgb(0 0 0 / .14)}
.cap{height:32px;display:flex;align-items:center;background:var(--toolbar);padding-left:12px;gap:8px}
.cap svg.mark{width:16px;height:16px}
.cbs{margin-left:auto;display:flex;height:32px}
.cb{width:46px;height:32px;display:grid;place-items:center}
.cb svg{width:10px;height:10px;stroke:var(--text);stroke-width:1;fill:none}
.client{height:800px;display:grid;grid-template-columns:200px 1fr;grid-template-rows:1fr 26px}
.side{background:var(--surface);padding-top:8px;display:flex;flex-direction:column}
.si{height:40px;display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--textSecondary);font-size:14px;position:relative}
.si.on{color:var(--text);font-weight:600;background:var(--accentSubtle)}
.si.on::before{content:"";position:absolute;left:4px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.si .g{width:18px;height:18px}
.spacer{flex:1}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.ch{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border)}
.ch .t{font-size:16px;font-weight:600;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{height:32px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--border);border-radius:4px;background:var(--toolbar);white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--background);font-weight:600}
.btn .g{width:16px;height:16px}
.btn.pri .g{stroke:var(--background)}
.btn[aria-disabled="true"]{opacity:.45}
.g{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.body{flex:1;display:flex;min-height:0}
.list{flex:1;min-width:0;overflow:hidden}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-variant-numeric:tabular-nums}
th{height:32px;font-size:12px;font-weight:600;color:var(--textSecondary);text-align:left;padding:0 8px;border-bottom:1px solid var(--hair)}
td{height:28px;padding:0 8px;border-bottom:1px solid var(--hair);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{text-align:right}
tr.sel td{background:var(--accentSubtle)}
.st{display:inline-flex;align-items:center;gap:6px}
.st .g{width:16px;height:16px}
.c-ok{color:var(--success)} .c-warn{color:var(--warning)} .c-err{color:var(--error)} .c-info{color:var(--info)} .c-mute{color:var(--textSecondary)}
.st span{color:var(--text)}
.panel{width:280px;flex:none;border-left:1px solid var(--border);background:var(--toolbar);padding:16px;display:flex;flex-direction:column;gap:12px}
.prev{height:160px;background:var(--surfaceBase);display:grid;place-items:center;border-radius:2px}
.prev .img{width:72%;height:100%}
.field label{display:block;font-size:11px;color:var(--textSecondary);margin-bottom:4px}
.field .ctl{height:32px;border:1px solid var(--border);border-radius:4px;background:var(--background);display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.facts{font-size:11px;color:var(--textSecondary)}
.sb{grid-column:1/-1;background:var(--statusBar);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12px;color:var(--textSecondary)}
.sb .p{font-family:var(--mono)}
/* placeholder photograph */
.img{background:radial-gradient(circle at 30% 32%,#E9C27A 0 10%,transparent 11%),linear-gradient(180deg,#7FA6C4 0 46%,#4E6E5A 46% 70%,#3A4E40 70%)}
.empty{flex:1;display:grid;place-items:center;text-align:center}
.empty .g{width:48px;height:48px;color:var(--textSecondary)}
.empty h2{font-size:16px;font-weight:600;margin:12px 0 4px}
.empty p{margin:0 0 16px;color:var(--textSecondary)}
.empty .row{display:flex;gap:8px;justify-content:center}
.ctb{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;height:28px}
.seg span{display:flex;align-items:center;gap:6px;padding:0 10px}
.seg span+span{border-left:1px solid var(--border)}
.seg span.on{background:var(--accentSubtle);font-weight:600}
.seg .g,.tb .g{width:16px;height:16px}
.tb{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border-radius:4px}
.num{height:28px;width:64px;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;background:var(--background);font-variant-numeric:tabular-nums}
.pane{flex:1;min-height:240px;background:var(--surfaceBase);position:relative;padding:12px}
.pane .ph{position:absolute;inset:12px}
.pane .ph .img{position:absolute;inset:0}
.pane .ph .res{clip-path:inset(0 0 0 50%);filter:saturate(1.04)}
.wipe{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--accent)}
.grab{position:absolute;top:50%;left:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:12px;background:var(--accent);color:var(--background);font-size:11px;font-weight:600;display:grid;place-items:center}
.lbl{position:absolute;top:8px;font-size:11px;font-weight:600;background:var(--scrim);color:#fff;padding:2px 6px;border-radius:3px}
.bar{display:flex;align-items:center;gap:8px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--surfaceActive);flex:1;position:relative}
.bar i b{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--textSecondary)}
tr.sel .bar i b{background:var(--accent)}
.bar small{font-size:11px;width:32px;text-align:right}
</style>
</head>

<script>
(function(){
  var items=[["Images","i-images"],["Compare","i-columns"],["Samples","i-library"],null,["Activity","i-activity"],["Settings","i-settings"],["About","i-info"]];
  var tpl=document.getElementById("chrome");
  document.querySelectorAll(".win").forEach(function(w){
    w.insertBefore(tpl.content.cloneNode(true),w.firstChild);
    var active=+w.dataset.active, nav=w.querySelector(".side"), k=0;
    items.forEach(function(it){
      var el=document.createElement("span");
      if(!it){el.className="spacer";nav.appendChild(el);return;}
      el.className="si"+(k===active?" on":"");
      el.innerHTML='<svg class="g"><use href="#'+it[1]+'"/></svg>'+it[0];
      nav.appendChild(el);k++;
    });
  });
  function set(t){
    document.documentElement.dataset.theme=t;
    document.getElementById("t-light").setAttribute("aria-pressed",t==="light");
    document.getElementById("t-dark").setAttribute("aria-pressed",t==="dark");
  }
  document.getElementById("t-light").onclick=function(){set("light")};
  document.getElementById("t-dark").onclick=function(){set("dark")};
  if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)set("dark");
})();
</script>
