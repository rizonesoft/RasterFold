# Independent from .conclave/panel.toml, which continues to serve Claude.
# The initial reviewer pin uses the repository's existing registered Claude model.
# A pin is usable only after a successful private-slot probe; record it in docs/reviews.
[writer]
model = "gpt-6-astra"
[model.gpt-6-astra]
family = "codex"
[model.claude-opus-5-5]
family = "claude"
[slot.bulk]
model = "claude-opus-5-5"
effort = "medium"
timeout = 600
[slot.signoff]
model = "claude-opus-5-5"
effort = "high"
timeout = 600
[slot.depth]
model = "claude-opus-5-5"
effort = "high"
timeout = 600
[slot.plan-primary]
model = "claude-opus-5-5"
effort = "high"
timeout = 900
[slot.stamp-check]
model = "claude-opus-5-5"
effort = "high"
timeout = 600
[slot.independent]
# Operator raised 900 to 1800 on 2026-10-20 after three 900 s timeouts on D00 T04 §1; probe recorded in docs/reviews/00-workspace/D00-T04-s1.md.
model = "claude-opus-5-5"
effort = "high"
timeout = 1800
[slot.arch-primary]
model = "claude-opus-5-5"
effort = "high"
timeout = 600
